<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="plc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#plc-bg)" />
  
  <!-- DIN Rails and Modules -->
  <g stroke="#30363d" stroke-width="2" fill="#161b22">
    <!-- Top DIN Rail -->
    <line x1="100" y1="200" x2="1100" y2="200" stroke="#8b949e" stroke-width="6" />
    <!-- Bottom DIN Rail -->
    <line x1="100" y1="460" x2="1100" y2="460" stroke="#8b949e" stroke-width="6" />

    <!-- CPU Module -->
    <rect x="140" y="130" width="140" height="220" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
    <!-- Communication Card -->
    <rect x="300" y="140" width="80" height="200" rx="3" fill="#21262d" />
    <!-- Digital Input Bank -->
    <rect x="400" y="140" width="100" height="200" rx="3" fill="#21262d" />
    <rect x="520" y="140" width="100" height="200" rx="3" fill="#21262d" />
    <!-- Analog I/O Bank -->
    <rect x="640" y="140" width="100" height="200" rx="3" fill="#21262d" />
    <rect x="760" y="140" width="100" height="200" rx="3" fill="#21262d" />
    <!-- Safety Relay Module -->
    <rect x="880" y="130" width="140" height="220" rx="3" fill="#21262d" stroke="#ed1c24" stroke-width="2" />

    <!-- Lower Terminal Blocks -->
    <rect x="140" y="420" width="880" height="120" rx="2" fill="#1c2128" />
  </g>

  <!-- Wiring harnesses and terminal details -->
  <g stroke="#484f58" stroke-width="1">
    <path d="M 210 350 L 210 420" stroke="#58a6ff" stroke-width="2" />
    <path d="M 450 340 L 450 420" stroke="#3fb950" stroke-width="2" />
    <path d="M 570 340 L 570 420" stroke="#3fb950" stroke-width="2" />
    <path d="M 690 340 L 690 420" stroke="#d29922" stroke-width="2" />
    <path d="M 950 350 L 950 420" stroke="#ed1c24" stroke-width="2" />
  </g>

  <!-- LEDs & Status -->
  <g>
    <circle cx="170" cy="170" r="4" fill="#3fb950" />
    <circle cx="170" cy="190" r="4" fill="#3fb950" />
    <circle cx="170" cy="210" r="4" fill="#58a6ff" />
    <circle cx="910" cy="170" r="4" fill="#ed1c24" />
    <circle cx="910" cy="190" r="4" fill="#3fb950" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="11" fill="#8b949e">
    <text x="100" y="70" font-size="16" fill="#fff" font-weight="bold">ME GROUP // AUTOMATION &amp; PLC CONTROL ENCLOSURE</text>
    <text x="100" y="95" fill="#ed1c24">MODBUS TCP / PROFINET REDUNDANCY // AUTO-PLC-09</text>
    
    <text x="160" y="270" fill="#fff">PLC-CPU</text>
    <text x="420" y="270">DI-16</text>
    <text x="540" y="270">DI-16</text>
    <text x="660" y="270">AI-08</text>
    <text x="780" y="270">AO-04</text>
    <text x="900" y="270" fill="#ed1c24">SAFETY-ESTOP</text>

    <text x="140" y="600" font-size="13" fill="#e6edf3">TERMINAL STRIP: X1.01 — X1.96 // ALL CHANNELS VERIFIED</text>
  </g>

  <rect x="950" y="40" width="200" height="36" fill="#1f1f1f" stroke="#333" />
  <text x="1050" y="63" font-family="monospace" font-size="11" fill="#ed1c24" text-anchor="middle" font-weight="bold">DEVELOPMENT MEDIA</text>
</svg>
