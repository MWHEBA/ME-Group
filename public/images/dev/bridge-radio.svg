<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#0d1117" />

  <!-- Bridge Wheelhouse Console Framing -->
  <g stroke="#30363d" stroke-width="2" fill="#161b22">
    <!-- Wheelhouse Bridge Console Outline -->
    <polygon points="100,240 1100,240 1140,700 60,700" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <!-- Console Slanted Top Surface -->
    <polygon points="100,240 1100,240 1060,420 140,420" fill="#1f242c" stroke="#30363d" stroke-width="2" />
  </g>

  <!-- Radar / ECDIS Display Screen (Left / Center) -->
  <g transform="translate(180, 260)">
    <rect x="0" y="0" width="280" height="240" rx="6" fill="#0b0e14" stroke="#484f58" stroke-width="2" />
    <circle cx="140" cy="120" r="90" fill="#06121e" stroke="#1f6feb" stroke-width="1.5" />
    <circle cx="140" cy="120" r="60" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="140" cy="120" r="30" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="2,2" />
    <!-- Radar Sweep & Heading Line -->
    <line x1="140" y1="120" x2="200" y2="55" stroke="#388bfd" stroke-width="2" />
    <line x1="140" y1="30" x2="140" y2="210" stroke="#30363d" stroke-width="1" />
    <line x1="50" y1="120" x2="230" y2="120" stroke="#30363d" stroke-width="1" />
    <!-- Blips -->
    <circle cx="180" cy="80" r="3" fill="#58a6ff" />
    <circle cx="100" cy="150" r="3" fill="#58a6ff" />
    <text x="10" y="230" fill="#8b949e" font-family="monospace" font-size="11" letter-spacing="1">RADAR / ARPA 3CM</text>
  </g>

  <!-- GMDSS VHF / DSC Radio Station (Center) -->
  <g transform="translate(490, 260)">
    <rect x="0" y="0" width="300" height="150" rx="4" fill="#11151c" stroke="#30363d" stroke-width="2" />
    <!-- Digital Frequency Display (CH 16 / DSC) -->
    <rect x="20" y="20" width="180" height="50" fill="#040d1a" stroke="#1f6feb" stroke-width="1" />
    <text x="30" y="52" fill="#58a6ff" font-family="monospace" font-size="22" font-weight="bold">CH 16 / 156.800</text>
    <!-- Distress Guard LED & Button -->
    <rect x="215" y="20" width="65" height="50" rx="3" fill="#2d1215" stroke="#f85149" stroke-width="1" />
    <circle cx="247" cy="45" r="10" fill="#da3633" />
    <text x="222" y="32" fill="#ff7b72" font-family="monospace" font-size="7" font-weight="bold">DISTRESS</text>
    <!-- Radio Control Knobs & Keypad -->
    <g fill="#21262d" stroke="#484f58">
      <circle cx="40" cy="105" r="14" />
      <circle cx="85" cy="105" r="14" />
      <circle cx="130" cy="105" r="14" />
      <!-- Mic socket -->
      <circle cx="180" cy="105" r="12" fill="#0d1117" />
    </g>
    <!-- Fist Mic Wire -->
    <path d="M 180,117 Q 200,160 215,130 Q 230,170 245,135 L 260,140" fill="none" stroke="#484f58" stroke-width="3" />
    <text x="20" y="140" fill="#8b949e" font-family="monospace" font-size="10">GMDSS VHF DSC CLASS A</text>
  </g>

  <!-- Inmarsat Satellite Terminal & MF/HF Console (Right) -->
  <g transform="translate(820, 260)">
    <rect x="0" y="0" width="260" height="240" rx="6" fill="#0b0e14" stroke="#484f58" stroke-width="2" />
    <rect x="15" y="15" width="230" height="130" fill="#03140e" stroke="#238636" stroke-width="1" />
    <!-- Sat-C Message Screen -->
    <text x="25" y="40" fill="#3fb950" font-family="monospace" font-size="12">INMARSAT-C // ONLINE</text>
    <text x="25" y="60" fill="#7ee787" font-family="monospace" font-size="10">GPS: 31°15.5'N 029°59.2'E</text>
    <text x="25" y="80" fill="#7ee787" font-family="monospace" font-size="10">SAT: AOR-E ELEV: 48.2°</text>
    <text x="25" y="100" fill="#7ee787" font-family="monospace" font-size="10">EGC NAVTEX: MONITORING</text>
    <text x="25" y="125" fill="#3fb950" font-family="monospace" font-size="11">SIGNAL QUALITY: EXCELLENT</text>
    <!-- Keyboard Area -->
    <rect x="15" y="160" width="230" height="60" fill="#161b22" stroke="#30363d" />
    <g fill="#30363d">
      <rect x="25" y="170" width="18" height="12" rx="2" />
      <rect x="48" y="170" width="18" height="12" rx="2" />
      <rect x="71" y="170" width="18" height="12" rx="2" />
      <rect x="94" y="170" width="18" height="12" rx="2" />
      <rect x="117" y="170" width="18" height="12" rx="2" />
      <rect x="140" y="170" width="18" height="12" rx="2" />
      <rect x="163" y="170" width="18" height="12" rx="2" />
      <rect x="186" y="170" width="18" height="12" rx="2" />
      <rect x="25" y="188" width="18" height="12" rx="2" />
      <rect x="48" y="188" width="18" height="12" rx="2" />
      <rect x="71" y="188" width="87" height="12" rx="2" />
      <rect x="163" y="188" width="41" height="12" rx="2" />
    </g>
    <text x="15" y="234" fill="#8b949e" font-family="monospace" font-size="10">INMARSAT-C TRANSCEIVER</text>
  </g>

  <!-- Lower Bridge Equipment Rack & Reserve Power Indicators -->
  <g transform="translate(180, 530)">
    <!-- Reserve Battery Charger & Telemetry Module -->
    <rect x="0" y="0" width="430" height="140" rx="4" fill="#11151c" stroke="#30363d" stroke-width="2" />
    <text x="20" y="30" fill="#8b949e" font-family="monospace" font-size="12" font-weight="bold">GMDSS 24V DC RESERVE BATTERY SYSTEM</text>
    <!-- Voltage and Amperage Gauges -->
    <g transform="translate(30, 45)">
      <circle cx="40" cy="40" r="32" fill="#0d1117" stroke="#484f58" stroke-width="2" />
      <text x="25" y="45" fill="#f0883e" font-family="monospace" font-size="13" font-weight="bold">27.4V</text>
      <text x="22" y="60" fill="#8b949e" font-family="monospace" font-size="8">FLOAT VOLT</text>
    </g>
    <g transform="translate(130, 45)">
      <circle cx="40" cy="40" r="32" fill="#0d1117" stroke="#484f58" stroke-width="2" />
      <text x="28" y="45" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">1.8A</text>
      <text x="22" y="60" fill="#8b949e" font-family="monospace" font-size="8">CHG CURRENT</text>
    </g>
    <!-- Status LEDs -->
    <g transform="translate(240, 55)">
      <circle cx="10" cy="10" r="6" fill="#238636" />
      <text x="25" y="14" fill="#7ee787" font-family="monospace" font-size="10">AC MAINS NORMAL</text>
      <circle cx="10" cy="35" r="6" fill="#30363d" />
      <text x="25" y="39" fill="#8b949e" font-family="monospace" font-size="10">BATTERY BACKUP READY</text>
      <circle cx="10" cy="60" r="6" fill="#30363d" />
      <text x="25" y="64" fill="#8b949e" font-family="monospace" font-size="10">EARTH FAULT: CLEAR</text>
    </g>
  </g>

  <!-- Emergency Beacons & Navtex (Lower Right) -->
  <g transform="translate(640, 530)">
    <rect x="0" y="0" width="440" height="140" rx="4" fill="#11151c" stroke="#30363d" stroke-width="2" />
    <text x="20" y="30" fill="#8b949e" font-family="monospace" font-size="12" font-weight="bold">SAFETY &amp; EMERGENCY EQUIPMENT STATUS</text>
    <!-- EPIRB Unit Icon -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="50" height="75" rx="15" fill="#f0883e" stroke="#d29922" stroke-width="2" />
      <line x1="25" y1="0" x2="25" y2="-20" stroke="#f0883e" stroke-width="3" />
      <circle cx="25" cy="-22" r="4" fill="#ff7b72" />
      <text x="10" y="42" fill="#0d1117" font-family="monospace" font-size="8" font-weight="bold">EPIRB</text>
      <text x="60" y="25" fill="#e6edf3" font-family="monospace" font-size="11">406 MHz Cospas-Sarsat</text>
      <text x="60" y="45" fill="#3fb950" font-family="monospace" font-size="10">HRU Expiry: OK (Class Certified)</text>
    </g>
    <!-- SART Unit Icon -->
    <g transform="translate(240, 45)">
      <rect x="0" y="10" width="22" height="65" rx="5" fill="#f0883e" stroke="#d29922" stroke-width="2" />
      <text x="32" y="25" fill="#e6edf3" font-family="monospace" font-size="11">9 GHz Radar SART</text>
      <text x="32" y="45" fill="#3fb950" font-family="monospace" font-size="10">Transponder: Ready</text>
      <text x="32" y="65" fill="#8b949e" font-family="monospace" font-size="10">Wheelhouse &amp; Bridge Wings</text>
    </g>
  </g>

  <!-- Technical Division Labeling -->
  <text x="60" y="750" fill="#58a6ff" font-family="monospace" font-size="12" letter-spacing="1">ME GROUP // SPECIALIST MARINE ELECTRONICS &amp; COMMUNICATIONS (DISCIPLINE 08)</text>
  <text x="880" y="750" fill="#8b949e" font-family="monospace" font-size="12">GLOBAL MARITIME CONNECTIONS</text>
</svg>
