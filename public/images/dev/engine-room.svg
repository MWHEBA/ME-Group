<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="eng-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="50%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <pattern id="eng-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="0.75" />
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#eng-bg)" />
  <rect width="1200" height="800" fill="url(#eng-grid)" opacity="0.4" />
  
  <!-- Engine Block Silhouette & Schematics -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <!-- Main Cylinder Heads -->
    <rect x="250" y="220" width="120" height="280" rx="4" fill="#181818" stroke="#555" stroke-width="2" />
    <rect x="410" y="220" width="120" height="280" rx="4" fill="#181818" stroke="#555" stroke-width="2" />
    <rect x="570" y="220" width="120" height="280" rx="4" fill="#181818" stroke="#555" stroke-width="2" />
    <rect x="730" y="220" width="120" height="280" rx="4" fill="#181818" stroke="#555" stroke-width="2" />
    <rect x="890" y="220" width="120" height="280" rx="4" fill="#181818" stroke="#555" stroke-width="2" />
    
    <!-- Crankcase & Base -->
    <rect x="200" y="500" width="860" height="160" rx="6" fill="#151515" stroke="#444" stroke-width="2" />
    
    <!-- Manifolds and Piping -->
    <path d="M 150 280 L 1050 280 L 1050 320 L 150 320 Z" fill="#222" stroke="#ed1c24" stroke-width="1.5" />
    <path d="M 180 360 L 1020 360 L 1020 390 L 180 390 Z" fill="#1f1f1f" stroke="#666" />
    
    <!-- Turbocharger / Exhaust -->
    <circle cx="160" cy="300" r="70" fill="#1a1a1a" stroke="#ed1c24" stroke-width="2" />
    <circle cx="160" cy="300" r="40" fill="#111" stroke="#555" />
    <path d="M 160 230 L 160 160 L 90 120" stroke="#ed1c24" stroke-width="3" />
  </g>

  <!-- Technical Overlay Elements -->
  <g font-family="monospace" font-size="12" fill="#888">
    <text x="260" y="250" fill="#ed1c24">CYL / 01 [ACTIVE]</text>
    <text x="420" y="250">CYL / 02 [ACTIVE]</text>
    <text x="580" y="250">CYL / 03 [ACTIVE]</text>
    <text x="740" y="250">CYL / 04 [ACTIVE]</text>
    <text x="900" y="250">CYL / 05 [ACTIVE]</text>
    <text x="50" y="60" font-size="14" fill="#fff" font-weight="bold">ME GROUP // PROPULSION &amp; AUX ENGINE LAB</text>
    <text x="50" y="85" fill="#ed1c24">SPEC: 4-STROKE TURBOCHARGED MARINE DIESEL // REF: SYS-ENG-884</text>
    
    <!-- Measurement lines -->
    <line x1="200" y1="700" x2="1060" y2="700" stroke="#ed1c24" stroke-width="1" stroke-dasharray="4,4" />
    <text x="580" y="720" fill="#ed1c24" text-anchor="middle">OVERALL LENGTH: 8,600 MM</text>
  </g>

  <!-- Watermark / Stamp -->
  <rect x="950" y="40" width="200" height="36" fill="#1f1f1f" stroke="#333" />
  <text x="1050" y="63" font-family="monospace" font-size="11" fill="#ed1c24" text-anchor="middle" font-weight="bold">DEVELOPMENT MEDIA</text>
</svg>
