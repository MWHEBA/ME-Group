<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="gen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1d" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#gen-bg)" />
  
  <!-- Alternator & Stator Housing -->
  <g stroke="#3e4451" stroke-width="2" fill="#21252b">
    <!-- Stator Casing -->
    <rect x="250" y="200" width="550" height="380" rx="8" />
    <!-- End Shield & Bearing -->
    <rect x="150" y="260" width="100" height="260" rx="4" fill="#1c2025" />
    <rect x="800" y="240" width="120" height="300" rx="4" fill="#1c2025" />
    
    <!-- Shaft & Coupling Hub -->
    <rect x="70" y="360" width="80" height="60" fill="#282c34" stroke="#ed1c24" stroke-width="2" />
    <!-- Exciter Housing -->
    <rect x="920" y="280" width="100" height="220" rx="4" fill="#181a1f" stroke="#ed1c24" stroke-width="1.5" />
    
    <!-- Terminal Box on Top -->
    <rect x="400" y="110" width="250" height="90" rx="4" fill="#1c2025" stroke="#ed1c24" stroke-width="2" />
  </g>

  <!-- Stator Cooling Fins / Ribs -->
  <g stroke="#2c313a" stroke-width="2">
    <line x1="290" y1="200" x2="290" y2="580" />
    <line x1="340" y1="200" x2="340" y2="580" />
    <line x1="390" y1="200" x2="390" y2="580" />
    <line x1="440" y1="200" x2="440" y2="580" />
    <line x1="490" y1="200" x2="490" y2="580" />
    <line x1="540" y1="200" x2="540" y2="580" />
    <line x1="590" y1="200" x2="590" y2="580" />
    <line x1="640" y1="200" x2="640" y2="580" />
    <line x1="690" y1="200" x2="690" y2="580" />
    <line x1="740" y1="200" x2="740" y2="580" />
  </g>

  <!-- Technical Schematic Text & Markers -->
  <g font-family="monospace" font-size="11" fill="#8b949e">
    <text x="80" y="70" font-size="16" fill="#fff" font-weight="bold">ME GROUP // SYNCHRONOUS MARINE GENERATOR &amp; AVR</text>
    <text x="80" y="95" fill="#ed1c24">1,250 kVA // 450V // 60Hz // 1,800 RPM // CLASS H INSULATION</text>
    
    <text x="420" y="155" fill="#ed1c24">AVR &amp; POWER TERMINAL BOX</text>
    <text x="930" y="400" fill="#abb2bf">BRUSHLESS EXCITER</text>
    <text x="80" y="440" fill="#abb2bf">DRIVE FLANGE</text>

    <!-- Dimension reference line -->
    <line x1="70" y1="640" x2="1020" y2="640" stroke="#ed1c24" stroke-width="1.5" />
    <circle cx="70" cy="640" r="4" fill="#ed1c24" />
    <circle cx="1020" cy="640" r="4" fill="#ed1c24" />
    <text x="545" y="665" fill="#ed1c24" text-anchor="middle">TOTAL LENGTH: 2,480 MM</text>
  </g>

  <rect x="950" y="40" width="200" height="36" fill="#1f1f1f" stroke="#333" />
  <text x="1050" y="63" font-family="monospace" font-size="11" fill="#ed1c24" text-anchor="middle" font-weight="bold">DEVELOPMENT MEDIA</text>
</svg>
