<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="100%" stop-color="#0e0f11" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sp-bg)" />
  
  <!-- High precision components: Bearings, Valves, Injectors, Piston Rings -->
  <g stroke="#3e4451" stroke-width="2" fill="#21252b">
    <!-- Huge Slewing Bearing Ring -->
    <circle cx="340" cy="420" r="180" fill="none" stroke="#5c6370" stroke-width="24" />
    <circle cx="340" cy="420" r="140" fill="none" stroke="#ed1c24" stroke-width="4" stroke-dasharray="8,6" />
    
    <!-- Fuel Injection Pump Element -->
    <rect x="620" y="240" width="90" height="340" rx="4" fill="#1b1e23" stroke="#ed1c24" stroke-width="2" />
    <rect x="640" y="180" width="50" height="60" fill="#282c34" stroke="#555" />
    <polygon points="630,580 700,580 665,650" fill="#181a1f" stroke="#ed1c24" stroke-width="2" />

    <!-- Piston Ring Set Isometric Stacks -->
    <ellipse cx="880" cy="300" rx="140" ry="40" fill="none" stroke="#abb2bf" stroke-width="6" />
    <ellipse cx="880" cy="360" rx="140" ry="40" fill="none" stroke="#ed1c24" stroke-width="6" />
    <ellipse cx="880" cy="420" rx="140" ry="40" fill="none" stroke="#abb2bf" stroke-width="6" />
    <ellipse cx="880" cy="480" rx="140" ry="40" fill="none" stroke="#abb2bf" stroke-width="6" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="11" fill="#8b949e">
    <text x="80" y="70" font-size="16" fill="#fff" font-weight="bold">ME GROUP // CRITICAL OEM-EQUIVALENT MARINE SPARE PARTS</text>
    <text x="80" y="95" fill="#ed1c24">MAN B&amp;W // WARTSILA // YANMAR // DAIHATSU // RAPID AIR-FREIGHT DISPATCH</text>
    
    <text x="250" y="425" fill="#fff">MAIN BEARING SHELL</text>
    <text x="600" y="160" fill="#ed1c24">COMMON-RAIL INJECTOR</text>
    <text x="810" y="240" fill="#abb2bf">COMPRESSION RING PACK</text>
    <text x="880" y="560" fill="#3fb950">CLASS 3.1 MATERIAL CERTIFIED</text>
  </g>

  <rect x="950" y="40" width="200" height="36" fill="#1f1f1f" stroke="#333" />
  <text x="1050" y="63" font-family="monospace" font-size="11" fill="#ed1c24" text-anchor="middle" font-weight="bold">DEVELOPMENT MEDIA</text>
</svg>
