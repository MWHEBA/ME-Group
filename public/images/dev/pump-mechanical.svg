<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pump-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161a" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#pump-bg)" />
  
  <!-- Centrifugal / Ballast Pump Body & Impeller housing -->
  <g stroke="#3a404d" stroke-width="2" fill="#1f232b">
    <!-- Volute Casing (Spiral) -->
    <circle cx="480" cy="420" r="180" fill="#242933" stroke="#ed1c24" stroke-width="3" />
    <circle cx="480" cy="420" r="100" fill="#181a1f" stroke="#4c566a" stroke-width="2" />
    <!-- Suction Flange (Center) -->
    <circle cx="480" cy="420" r="50" fill="#0e1013" stroke="#ed1c24" stroke-width="2" />
    
    <!-- Discharge Neck & Flange (Top) -->
    <rect x="420" y="160" width="120" height="120" fill="#242933" />
    <rect x="390" y="130" width="180" height="30" fill="#181a1f" stroke="#ed1c24" stroke-width="2" />

    <!-- Drive Motor (Right) -->
    <rect x="700" y="300" width="340" height="240" rx="8" fill="#1e222a" stroke="#4c566a" stroke-width="2" />
    <!-- Motor cooling cowl -->
    <rect x="1040" y="320" width="60" height="200" rx="4" fill="#16181e" stroke="#333" />
    <!-- Coupling Guard -->
    <rect x="620" y="360" width="80" height="120" fill="#181a1f" stroke="#ed1c24" stroke-width="2" />
  </g>

  <!-- Flow Direction Arrows & Diagnostics -->
  <g stroke="#ed1c24" stroke-width="2" fill="none">
    <path d="M 480 380 A 40 40 0 0 1 520 420" />
    <path d="M 480 220 L 480 150" stroke-width="4" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="11" fill="#8b949e">
    <text x="80" y="70" font-size="16" fill="#fff" font-weight="bold">ME GROUP // HEAVY BALLAST &amp; COOLING WATER PUMP OVERHAUL</text>
    <text x="80" y="95" fill="#ed1c24">FLOW: 450 m³/h // HEAD: 32M // MECH SEAL FLUSH TYPE // MECH-PUMP-14</text>
    
    <text x="400" y="105" fill="#ed1c24">DISCHARGE FLANGE DN200</text>
    <text x="440" y="425" fill="#fff">SUCTION DN250</text>
    <text x="780" y="425" fill="#abb2bf">ELECTRIC MOTOR 45 kW</text>
  </g>

  <rect x="950" y="40" width="200" height="36" fill="#1f1f1f" stroke="#333" />
  <text x="1050" y="63" font-family="monospace" font-size="11" fill="#ed1c24" text-anchor="middle" font-weight="bold">DEVELOPMENT MEDIA</text>
</svg>
